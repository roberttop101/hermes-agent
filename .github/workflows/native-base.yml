name: Native base
on:
  pull_request:
  push:
    branches: [main, 'codex/native-execution-control-*']
permissions:
  contents: read
jobs:
  native-base:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.0'
      - name: Provision through PM
        run: |
          python -m pip install uv==0.12.0
          python -m pm.build_env --source . --out "$RUNNER_TEMP/runtime" --group dev --group test
      - name: Upstream checks and native tests
        run: |
          "$RUNNER_TEMP/runtime/bin/python" scripts/check
          HERMES_PYTHON="$RUNNER_TEMP/runtime/bin/python" scripts/run_tests.sh tests/hermes_cli/test_kanban_db.py tests/hermes_cli/test_plugins_loader.py tests/hermes_cli/test_plugins.py
      - name: Dashboard validation
        run: |
          npm ci --ignore-scripts --include-workspace-root --workspace web
          npm run check --workspace web
          npm run build --workspace web
          npm audit --omit=dev --workspace web --audit-level=moderate
